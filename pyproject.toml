[project]
name = "hf-resilient-downloader"
version = "0.1.0"
description = "支持断点续传、自动重试和多线程的 Hugging Face 模型下载器"
requires-python = ">=3.11"
dependencies = [
    "rich>=14.1,<15",
]

[project.scripts]
hf-download = "hf_downloader:main"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["hf_downloader.py", "hf_storage.py"]

[dependency-groups]
dev = ["pytest>=8.2,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
